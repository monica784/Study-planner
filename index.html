<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Planner</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <div class="header__inner">
      <span class="header__icon">📚</span>
      <h1 class="header__title">Study Planner</h1>
    </div>
  </header>

  <main class="main">

    <!-- ADD TASK FORM -->
    <section class="card form-card">
      <h2 class="card__heading">Add New Task</h2>
      <form id="task-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" placeholder="e.g. Mathematics" autocomplete="off" required />
          </div>
          <div class="form-group">
            <label for="due-date">Due Date</label>
            <input type="date" id="due-date" required />
          </div>
        </div>
        <div class="form-group">
          <label for="description">Task Description</label>
          <input type="text" id="description" placeholder="e.g. Chapter 5 exercises" autocomplete="off" required />
        </div>
        <button type="submit" class="btn btn--primary">Add Task</button>
      </form>
    </section>

    <!-- FILTERS & SORT -->
    <section class="toolbar">
      <div class="toolbar__filters">
        <div class="filter-group">
          <label for="filter-subject">Subject</label>
          <select id="filter-subject">
            <option value="all">All Subjects</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-status">Status</label>
          <select id="filter-status">
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="done">Completed</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="sort-order">Sort By</label>
          <select id="sort-order">
            <option value="asc">Due Date ↑</option>
            <option value="desc">Due Date ↓</option>
          </select>
        </div>
      </div>
      <div class="toolbar__stats">
        <span id="task-count" class="task-count"></span>
      </div>
    </section>

    <!-- TASK LIST -->
    <section id="task-list" class="task-list" aria-live="polite">
      <!-- tasks injected by JS -->
    </section>

  </main>

  <footer class="footer">
    <p>Study Planner &mdash; all data saved locally in your browser.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
